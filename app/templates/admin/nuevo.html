{% extends "base.html" %}
{% block title %}Nuevo Usuario — SPI-Inventario{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0" style="color: #1F3864;">
        <i class="bi bi-person-plus me-2"></i>Nuevo Usuario
    </h4>
    <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Volver
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin.nuevo') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nombre Completo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="nombre"
                           placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nombre de Usuario <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="username"
                           placeholder="Ej: juan.perez" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" name="password"
                           placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Rol <span class="text-danger">*</span></label>
                    <select class="form-select" name="rol" required>
                        <option value="tecnico">Técnico</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>Crear Usuario
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
