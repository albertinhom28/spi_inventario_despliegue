{% extends "base.html" %}
{% block title %} Editar Usuario {% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0" style="color: #1F3864;">
        <i class="bi bi-person-gear me-2"></i>Editar Usuario — {{ usuario.username }}
    </h4>
    <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Volver
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin.editar', id=usuario.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nombre Completo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="nombre"
                           value="{{ usuario.nombre }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nombre de Usuario</label>
                    <input type="text" class="form-control" value="{{ usuario.username }}" disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nueva Contraseña</label>
                    <input type="password" class="form-control" name="password"
                           placeholder="Dejar en blanco para no cambiar">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Rol <span class="text-danger">*</span></label>
                    <select class="form-select" name="rol" required>
                        <option value="tecnico" {% if usuario.rol == 'tecnico' %}selected{% endif %}>Técnico</option>
                        <option value="supervisor" {% if usuario.rol == 'supervisor' %}selected{% endif %}>Supervisor</option>
                        <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>Administrador</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Estado <span class="text-danger">*</span></label>
                    <select class="form-select" name="activo" required>
                        <option value="true" {% if usuario.activo %}selected{% endif %}>Activo</option>
                        <option value="false" {% if not usuario.activo %}selected{% endif %}>Inactivo</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
